[project]
name = "mfg-c2-021"
version = "0.1.0"
description = "ManufacturingSafetyQAAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by CI per repository generation — a stub package on PYTHONPATH for older repos,
# or installed from the package registry for wheel-era repos (see the dual-mode
# run-tests job in the pipeline definition). Pinning it here would make `pip install -e .`
# fail because it is not resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20260815",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The sample files under src/examples/ are reference material shipped with the
# project template, not part of the agent — they are excluded rather than edited.
exclude = ["src/examples/"]
# The published agenticstar-agentcore wheel ships no py.typed marker, so every
# framework.* / shared.* import resolves to Any and each required framework
# subclass becomes an import-untyped / subclass-of-Any error. All other strict
# settings stay on.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "langgraph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# AgentState resolves to Any for the same reason, so subclassing it makes every
# field of the state schema fail valid-type. One cause, one suppression — the
# individual field errors are not separate problems.
module = ["src.schemas.state"]
disable_error_code = ["valid-type"]
